<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <!-- 模板：測試金字塔（4 層）
       改這些：標題、每層名稱（L1-L4 label）、右側百分比與說明（note） -->
  <rect x="1" y="1" width="898" height="468" rx="16" fill="#ffffff" stroke="#e2e7ed" stroke-width="2"/>
  <text x="28" y="44" font-size="20" font-weight="700" fill="#1d232b">測試金字塔</text>

  <!-- L1 頂層 -->
  <polygon points="360,60 430.8,145 289.2,145" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="360" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">E2E</text>
  <!-- L2 -->
  <polygon points="285.8,149 434.2,149 505,234 215,234" fill="#fff7eb" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">整合 / API</text>
  <!-- L3 -->
  <polygon points="211.7,238 508.3,238 579.2,323 140.8,323" fill="#f5f1ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="360" y="287" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">元件測試</text>
  <!-- L4 底層 -->
  <polygon points="137.5,327 582.5,327 653.3,412 66.7,412" fill="#ecfdf8" stroke="#0f766e" stroke-width="1.5"/>
  <text x="360" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">單元測試</text>

  <!-- 右側說明欄 -->
  <g stroke="#c3cad3" stroke-width="1.2" stroke-dasharray="4 4">
    <path d="M410 105H708"/><path d="M482 191H708"/><path d="M556 280H708"/><path d="M630 369H708"/>
  </g>
  <g font-size="20" font-weight="700" fill="#1d232b">
    <text x="720" y="104">5%</text><text x="720" y="190">15%</text><text x="720" y="279">20%</text><text x="720" y="368">60%</text>
  </g>
  <g font-size="13" fill="#5d6875">
    <text x="720" y="124">關鍵使用者流程</text>
    <text x="720" y="210">服務之間的契約</text>
    <text x="720" y="299">單一畫面或模組</text>
    <text x="720" y="388">每次 commit 都跑</text>
  </g>
  <text x="872" y="448" text-anchor="end" font-size="12" fill="#8a94a0">越往上越慢、越貴、越容易 flaky</text>
</svg>
