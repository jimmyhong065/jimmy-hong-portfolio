<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <!-- 模板：2×2 象限（風險矩陣）
       改這些：標題、兩軸名稱、四格標題、每格 1-3 個項目 -->
  <rect x="1" y="1" width="798" height="558" rx="16" fill="#ffffff" stroke="#e2e7ed" stroke-width="2"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#1d232b">風險矩陣</text>

  <!-- 左上：機率高、影響低 -->
  <rect x="122" y="62" width="316" height="206" rx="10" fill="#fff7eb"/>
  <text x="142" y="98" font-size="17" font-weight="700" fill="#b45309">常見小問題</text>
  <g font-size="14" fill="#3b4450"><text x="142" y="130">• 文案錯字</text><text x="142" y="156">• 小螢幕跑版</text></g>
  <!-- 右上：機率高、影響高 -->
  <rect x="442" y="62" width="316" height="206" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="462" y="98" font-size="17" font-weight="700" fill="#b91c1c">優先處理</text>
  <g font-size="14" fill="#3b4450"><text x="462" y="130">• 訂閱付款流程</text><text x="462" y="156">• 登入與帳號綁定</text><text x="462" y="182">• 資料同步遺失</text></g>
  <!-- 左下：機率低、影響低 -->
  <rect x="122" y="272" width="316" height="206" rx="10" fill="#f0fdf4"/>
  <text x="142" y="308" font-size="17" font-weight="700" fill="#15803d">可以先放著</text>
  <g font-size="14" fill="#3b4450"><text x="142" y="340">• 冷門設定頁</text></g>
  <!-- 右下：機率低、影響高 -->
  <rect x="442" y="272" width="316" height="206" rx="10" fill="#fff7eb"/>
  <text x="462" y="308" font-size="17" font-weight="700" fill="#b45309">要有備案</text>
  <g font-size="14" fill="#3b4450"><text x="462" y="340">• 跨年時區切換</text><text x="462" y="366">• 舊版資料遷移</text></g>

  <!-- 軸 -->
  <g font-size="13" fill="#5d6875">
    <text x="130" y="502">低</text><text x="750" y="502" text-anchor="end">高</text>
    <text x="108" y="80" text-anchor="end">高</text><text x="108" y="474" text-anchor="end">低</text>
  </g>
  <text x="440" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#1d232b">影響程度 →</text>
  <text x="70" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#1d232b" transform="rotate(-90 70 270)">發生機率 →</text>
</svg>
