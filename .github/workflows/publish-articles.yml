name: Sync Articles

# 只同步這次 push 有變動的文章內容；發布狀態不在這裡改（用 npm run publish）。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Sync changed articles
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against, skipping."; exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- docs \
            | grep -E '^docs/((drafts/)?[^/]+|course-[^/]+/article-[^/]+)\.md$' || true)
          if [ -z "$FILES" ]; then echo "No article changes."; exit 0; fi
          echo "$FILES"
          node upload-articles.mjs $FILES
